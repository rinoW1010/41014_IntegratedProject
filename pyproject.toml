[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turtlebot-project"
version = "0.1.0"
description = "steps 1-3: movement, encoder odometry and camera checks"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "mujoco>=3.2,<4", "opencv-contrib-python>=4.10,<5", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["turtlebot_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
